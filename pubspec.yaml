name: wplm
description: Official Dart/Flutter SDK for WP License Manager (WPLM) — validate, activate, and verify software licenses online and offline.
version: 0.2.0
repository: https://github.com/wplm/wplm-dart
homepage: https://github.com/wplm/wplm-dart
issue_tracker: https://github.com/wplm/wplm-dart/issues
topics:
  - licensing
  - drm
  - authentication
  - cryptography

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  crypto: ^3.0.3
  cryptography: ^2.7.0
  meta: ^1.12.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
